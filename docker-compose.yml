version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: minibank-postgres
    environment:
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: minibank
      POSTGRES_DB: minibank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibank"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - minibank-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: minibank-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - minibank-net

  adminer:
    image: adminer
    container_name: minibank-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minibank-net

  user-service:
    build:
      context: ./minibanklab_be/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      DATABASE_URL: "postgres://minibank:minibank@postgres:5432/minibank?sslmode=disable"
      JWT_SECRET: "minibank-jwt-secret-key-change-in-production"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - minibank-net

  account-service:
    build:
      context: ./minibanklab_be/account-service
      dockerfile: Dockerfile
    container_name: account-service
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      DATABASE_URL: "postgres://minibank:minibank@postgres:5432/minibank?sslmode=disable"
      JWT_SECRET: "minibank-jwt-secret-key-change-in-production"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - minibank-net

  transaction-service:
    build:
      context: ./minibanklab_be/transaction-service
      dockerfile: Dockerfile
    container_name: transaction-service
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      DATABASE_URL: "postgres://minibank:minibank@postgres:5432/minibank?sslmode=disable"
      JWT_SECRET: "minibank-jwt-secret-key-change-in-production"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      account-service:
        condition: service_started
    restart: on-failure
    networks:
      - minibank-net

  frontend:
    build:
      context: ./minibanklab_fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_USER_API_URL: "http://user-service:8081"
        NEXT_PUBLIC_ACCOUNT_API_URL: "http://account-service:8082"
        NEXT_PUBLIC_TRANSACTION_API_URL: "http://transaction-service:8083"
    container_name: minibank-frontend
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - account-service
      - transaction-service
    restart: on-failure
    networks:
      - minibank-net

volumes:
  postgres_data:

networks:
  minibank-net:
    driver: bridge
